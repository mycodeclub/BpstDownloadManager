name: build

on:
  push:
    branches: [main, bdm-2.0]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write   # attach installers to a GitHub Release on tags

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: "21"

      - name: Install .NET MAUI workloads
        run: dotnet workload install maui-windows maui-android

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Android release signing key (from repository secrets)
        shell: pwsh
        env:
          KEY_B64: ${{ secrets.BDM_KEYSTORE_BASE64 }}
          KEY_PASS: ${{ secrets.BDM_KEYSTORE_PASSWORD }}
        run: |
          if (-not $env:KEY_B64) { Write-Warning "BDM_KEYSTORE_BASE64 secret not set: APK will be debug-signed."; exit 0 }
          $path = Join-Path $env:RUNNER_TEMP "bdm-release.keystore"
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:KEY_B64))
          "BDM_KEYSTORE=$path" >> $env:GITHUB_ENV
          "BDM_KEYSTORE_PASSWORD=$env:KEY_PASS" >> $env:GITHUB_ENV

      - name: Test
        run: dotnet test tests/Bdm.Core.Tests -c Release

      - name: Build Windows installer + Android APK (includes the UI self-test)
        shell: pwsh
        run: |
          $isTag = $env:GITHUB_REF_TYPE -eq 'tag'
          $version = if ($isTag) { $env:GITHUB_REF_NAME.TrimStart('v') } else { '2.2.0' }
          # Release tags must be signed with the release key (a debug-signed APK can't update installed copies).
          if ($isTag) { ./build-installer.ps1 -Version $version } else { ./build-installer.ps1 -Version $version -AllowDebugSigning }
          # Stable names, so ".../releases/latest/download/<name>" links on the website never change.
          Copy-Item "dist/BDM-Setup-$version.exe" dist/BDM-Setup.exe
          Copy-Item "dist/BDM-$version-android.apk" dist/BDM-android.apk
          Get-ChildItem dist -File | Where-Object Name -like 'BDM-*' | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: BDM
          path: |
            dist/BDM-*
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: BPST Download Manager ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            Free, open-source download manager for Windows and Android, a product of BitProSoftTech (https://bitprosofttech.com).

            **Windows:** `BDM-Setup.exe` · **Android:** `BDM-android.apk`
            Builds are not code-signed yet: Windows SmartScreen may warn (More info → Run anyway); on Android allow "install unknown apps" for your browser.

            Project page: https://mycodeclub.github.io/BpstDownloadManager/
          files: |
            dist/BDM-*
            dist/SHA256SUMS.txt
