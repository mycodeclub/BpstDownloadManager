name: build

on:
  push:
    branches: [main, bdm-2.0]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write   # attach installers to a GitHub Release on tags

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: "21"

      - name: Install .NET MAUI workloads
        run: dotnet workload install maui-windows maui-android

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Test
        run: dotnet test tests/Bdm.Core.Tests -c Release

      - name: Build Windows installer + Android APK (includes the UI self-test)
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '2.0.0' }
          ./build-installer.ps1 -Version $version
          # Stable names, so ".../releases/latest/download/<name>" links on the website never change.
          Copy-Item "dist/BDM-Setup-$version.exe" dist/BDM-Setup.exe
          Copy-Item "dist/BDM-$version-android.apk" dist/BDM-android.apk
          Get-ChildItem dist -File | Where-Object Name -like 'BDM-*' | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: BDM
          path: |
            dist/BDM-*
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: BPST Download Manager ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            Free, open-source download manager for Windows and Android, a product of BitProSoftTech (https://bitprosofttech.com).

            **Windows:** `BDM-Setup.exe` · **Android:** `BDM-android.apk`
            Builds are not code-signed yet: Windows SmartScreen may warn (More info → Run anyway); on Android allow "install unknown apps" for your browser.

            Project page: https://mycodeclub.github.io/BpstDownloadManager/
          files: |
            dist/BDM-*
            dist/SHA256SUMS.txt
